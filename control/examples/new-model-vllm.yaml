# Template for a new model on vLLM without writing a target script. Copy, then change MODEL and the parsers.
script: targets/vllm-serve.sh
description: 새 모델 시험용 틀 (vLLM 범용 스크립트)
env:
  MODEL: Qwen/Qwen3.8-27B-FP8
  SERVED_MODEL_NAME: qwen3.8-27b-fp8-test
  PORT: "8010"
  CUDA_VISIBLE_DEVICES: "0,1"
  MAX_MODEL_LEN: "32768"
  REASONING_PARSER: qwen3
  TOOL_CALL_PARSER: qwen3_coder
  EXTRA_ARGS: "--language-model-only"
autostart: false
